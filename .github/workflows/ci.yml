name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/ZiwuMeridianClock/ZiwuMeridianClock.csproj -r win-x64
      - name: Build
        run: dotnet build src/ZiwuMeridianClock/ZiwuMeridianClock.csproj -c Release -r win-x64 --no-restore
      - name: Publish (single-file smoke test)
        run: dotnet publish src/ZiwuMeridianClock/ZiwuMeridianClock.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Check web assets
        shell: pwsh
        run: |
          foreach ($f in 'web/index.html','web/meridians.js','web/lib/three.module.js','web/models/body.bin','web/models/meridians3d.json') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

  cross-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cross-build with scripts/build.sh
        run: bash scripts/build.sh
