const bgMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
  uniforms:{uT:{value:0},uRes:{value:new THREE.Vector2(W,H)}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.9999,1.);}`,
  fragmentShader:`
  precision highp float; varying vec2 vUv; uniform float uT; uniform vec2 uRes;

  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}

const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat); bg.frustumCulled=false; bg.renderOrder=-10; scene.add(bg);

const root=new THREE.Group(); scene.add(root);
const body=new THREE.Group(); root.add(body);
const [meta,buf,MD]=await Promise.all([fetch("models/body.json").then(r=>r.json()),fetch("models/body.bin").then(r=>r.arrayBuffer()),fetch("models/meridians3d.json").then(r=>r.json())]);

const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(BP,3)); geo.setIndex(new THREE.BufferAttribute(BI,1)); geo.computeVertexNormals();
body.position.y=-8.24;   // 身体略下移，足部落入午位
// 近似环境光遮蔽：邻点相对法线的凹凸度（凹处变暗）
{ const nv=meta.nv, N=geo.attributes.normal.array, acc=new Float32Array(nv), cnt=new Float32Array(nv);
  const ed=(a,b)=>{const dx=BP[b*3]-BP[a*3],dy=BP[b*3+1]-BP[a*3+1],dz=BP[b*3+2]-BP[a*3+2]; const l=Math.hypot(dx,dy,dz)||1;

let SV={};
function buildDial(){

  d.innerHTML=`<defs>
   <filter id="tg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
   <filter id="tg2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
   <radialGradient id="orb"><stop offset="0" stop-color="#0a1230" stop-opacity=".85"/><stop offset=".75" stop-color="#0b1838" stop-opacity=".62"/><stop offset="1" stop-color="#2a4a80" stop-opacity=".25"/></radialGradient>
   <radialGradient id="orbA"><stop offset="0" stop-color="#3a2408" stop-opacity=".78"/><stop offset=".7" stop-color="#5a3a0e" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf6a" stop-opacity=".35"/></radialGradient></defs>`;

  const rt=Rr+44;
  for(let i=0;i<96;i++){const a=i*3.75,h=i%4===0;const [x0,y0]=P(rt-(h?6:2.5),a),[x1,y1]=P(rt+(h?6:2.5),a);
    el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:h?"#dff6ff":"#9fd8ff","stroke-opacity":h?.75:.28,"stroke-width":h?1.3:.8});}
  for(let h=0;h<24;h++){const [x,y]=P(rt+19,h*15);el("text",{x,y:y+5.5,"text-anchor":"middle","font-size":h%6===0?17:14.5,"font-weight":h%6===0?500:300,
    fill:h%6===0?"#f2fbff":"#bfe0f2","fill-opacity":h%6===0?.95:.75,class:"thin"},null,String(h));}

function dialUpdate(T,hf,sf,tsec,idx){
  if(SV.act!==idx) dialSetActive(idx);

  // 光晕点
  const pa=NG.attributes.position.array, ca=NG.attributes.color.array, sa=NG.attributes.size.array; let n=0;
  const put=(x,y,c,s)=>{pa[n*3]=x;pa[n*3+1]=y;pa[n*3+2]=0;ca[n*3]=c[0];ca[n*3+1]=c[1];ca[n*3+2]=c[2];sa[n]=s;n++;};
  const pul=.5+.5*Math.sin(tsec*2.4);
  for(let i=0;i<12;i++){const a=i*30*D2R; const on=i===idx; put(Math.sin(a)*Rr,Math.cos(a)*Rr,on?[1,.7,.3].map(v=>v*(.38+pul*.16)):[.30,.55,.9],on?82+pul*16:80);}
  put(Math.sin(head)*Rr,Math.cos(head)*Rr,[1,.82,.5],70); put(Math.sin(head)*Rr,Math.cos(head)*Rr,[1,.95,.85],22);
  const sA=sf/60*TAU; put(Math.sin(sA)*(Rr+44),Math.cos(sA)*(Rr+44),[.6,.95,1],16);
  for(let h=0;h<24;h++){const a=h*15*D2R, tw=.5+.5*Math.sin(tsec*1.7+h*2.3); put(Math.sin(a)*(Rr+44),Math.cos(a)*(Rr+44),[.5,.8,1].map(v=>v*(.35+tw*.35)),h%6===0?12:8);}
  for(let i=0;i<12;i++){const a=(i*30+15)*D2R; put(Math.sin(a)*Rr,Math.cos(a)*Rr,[.7,.9,1].map(v=>v*.6),9);}
  NG.setDrawRange(0,n); NG.attributes.position.needsUpdate=NG.attributes.color.needsUpdate=NG.attributes.size.needsUpdate=true;
  // 光束
  const len=Rr-30; beam.scale.set(20,len,1); beam.rotation.z=-head; beam.position.set(Math.sin(head)*len/2,Math.cos(head)*len/2,0);

  const tr=Rr-132; SV.tag.setAttribute("transform",`translate(${Math.sin(head)*tr} ${-Math.cos(head)*tr})`); SV.tagT.textContent=`${p2(T.h)}:${p2(T.m)}`;
}

 {yi:["专注高效工作学习","适量饮温水","起身走动，舒展四肢","按揉足三里、三阴交","保持心情愉快"],ji:["久坐不动","思虑过度","甜腻零食","生冷寒凉","午前暴食"]},
 {yi:["小憩15–30分钟","静心养神","心平气和","午餐七分饱","闭目调息"],ji:["剧烈运动","大喜大悲","午睡过长","饭后立即平卧","浓茶咖啡"]},
 {yi:["饭后缓步","多饮温水","适量吃水果","揉肩活颈","轻松处理事务"],ji:["暴饮暴食","饭后即卧","辛辣刺激","久坐低头","贪食冷饮"]},
 {yi:["多补充水分","适当运动出汗","高效学习工作","及时排尿","敲打腿后侧"],ji:["憋尿","久坐不饮水","过食咸味","受寒着凉","疲劳硬撑"]},
 {yi:["晚餐清淡适量","温水泡脚","放松休息","揉搓腰眼","适量黑色食物"],ji:["过度劳累","晚餐过饱","房劳过度","过食咸味","大汗淋漓"]},
 {yi:["散步、慢跑","温水沐浴","与家人愉快交谈","听舒缓音乐","按揉内关穴"],ji:["情绪压抑","剧烈争执","饱食即卧","刺激性影视","熬夜加班"]},
 {yi:["静卧修养生息","准备入眠","冥想、深呼吸","温水泡脚","23点前入睡"],ji:["熬夜玩手机","饮浓茶咖啡","思虑过度","剧烈运动","进食夜宵"]},

const legend=document.getElementById("legend");
ORDER.forEach((k,i)=>legend.insertAdjacentHTML("beforeend",`<span data-k="${k}"><i style="background:${M[k].color}"></i>${BR[i]} · ${M[k].name}</span>`));

/* ===================== 时间驱动 ===================== */
const WEEK="日一二三四五六", p2=n=>String(n).padStart(2,"0");
const t0=performance.now();
function now(){
  if(fixed){const d=new Date(fixedDate+"T00:00:00"); const add=FT||0; let s=fixed.h*3600+fixed.m*60+fixed.s+add;
    return {h:Math.floor(s/3600)%24,m:Math.floor(s/60)%60,s:Math.floor(s)%60,ms:(s%1)*1000,date:d};}
  const d=new Date(), b=new Date(d.getTime()+(d.getTimezoneOffset()+480)*60000);
  return {h:b.getHours(),m:b.getMinutes(),s:b.getSeconds(),ms:b.getMilliseconds(),date:b};
}
let curIdx=-1;
// 人体旋转：spin=周期秒（90/60/30），0 = 停止并回到正面；匀速，正面附近略慢
let SPIN=q.get("spin")!==null?Number(q.get("spin")):60, spPh0=0, spT0=0, spCur=0, spLast=null;
function spinPhase(t){return SPIN>0? spPh0+(t-spT0)*Math.PI*2/SPIN : spPh0;}
function setSpin(v,t){ spPh0=spinPhase(t); spT0=t; SPIN=Math.max(0,Number(v)||0); }
function spinAngle(t){
  const dt=spLast===null?0:Math.min(.5,Math.max(0,t-spLast)); spLast=t;
  if(SPIN>0){ const ph=spinPhase(t); spCur=ph-0.22*Math.sin(ph); return spCur; }   // dθ/dt 在正面为 0.78×，背面 1.22×
  const target=Math.round(spCur/(Math.PI*2))*Math.PI*2; spCur+=(target-spCur)*Math.min(1,dt*1.8); spPh0=spCur; return spCur;
}
function frame(tsec){
  const T=now(), sf=T.s+T.ms/1000, hf=T.h+T.m/60+sf/3600;
  const idx=Math.floor(((T.h+1)%24)/2);
  if(idx!==curIdx){
    curIdx=idx; const key=ORDER[idx], m=M[key]; setActive(key);
    if(!L.laid){L.laid=true; setTimeout(()=>dispatchEvent(new Event("resize")),0);}
    document.getElementById("sc").textContent=`${BR[idx]}时　${RANGE[idx]}`;
    document.getElementById("title").innerHTML=`${m.name}<em>当令</em>`;
    document.getElementById("dir").textContent=`循行　${m.dir}`;
    document.getElementById("route").innerHTML=`<b>起</b>${m.start}<br><b>止</b>${m.end}`;
    document.getElementById("yi").innerHTML=YJ[idx].yi.map(x=>`<li>${x}</li>`).join("");
    document.getElementById("ji").innerHTML=YJ[idx].ji.map(x=>`<li>${x}</li>`).join("");
    legend.querySelectorAll("span").forEach(s=>s.classList.toggle("on",s.dataset.k===key));
  }
  document.getElementById("clk").innerHTML=`${p2(T.h)}:${p2(T.m)}<small>${p2(Math.floor(sf))}</small>`;
  const D=T.date; document.getElementById("date").textContent=`${D.getFullYear()}年${D.getMonth()+1}月${D.getDate()}日　星期${WEEK[D.getDay()]}`;
  const tc=document.getElementById("tclk"); if(tc) tc.innerHTML=`${p2(T.h)}:${p2(T.m)}<br>${D.getFullYear()}/${D.getMonth()+1}/${D.getDate()}`;
  const start=(23+2*idx)%24; const e_=(hf-start+24)%24, pct=e_/2, remain=Math.round((2-e_)*3600);
  document.getElementById("prog").style.width=(pct*100).toFixed(2)+"%"; document.getElementById("knob").style.left=(pct*100).toFixed(2)+"%";
  document.getElementById("el").textContent=`已过 ${Math.floor(e_*60)} 分 · ${Math.round(pct*100)}%`;
  document.getElementById("rm").textContent=`剩余 ${Math.floor(remain/60)} 分 ${p2(remain%60)} 秒`;
  dialUpdate(T,hf,sf,tsec,idx);
  // 3D
  body.rotation.y = q.get("rot")!==null ? Number(q.get("rot"))*Math.PI/180 : spinAngle(tsec);
  U.uT.value=tsec; bgMat.uniforms.uT.value=tsec+40; grain.uniforms.uT.value=tsec;
  updateFlow(tsec);
  if(q.get("nopost")) renderer.render(scene,camera); else composer.render();
}
// 30fps 上限
let last=-1;
function loop(ts){
  if(paused){ setTimeout(()=>requestAnimationFrame(loop),500); return; }
  requestAnimationFrame(loop); if(ts-last<1000/FPS-1) return; last=ts; frame((ts-t0)/1000); }
// 桌面程序消息：{type:"pause"|"resume"|"fps",v}
try{ if(window.chrome&&window.chrome.webview) window.chrome.webview.addEventListener("message",ev=>{
  let m=ev.data; if(typeof m==="string"){try{m=JSON.parse(m);}catch(e){m={type:m};}}
  if(!m) return;
  if(m.type==="pause") paused=true;
  else if(m.type==="resume"){ paused=false; }
  else if(m.type==="fps" && m.v>0) FPS=Math.min(60,Number(m.v));
  else if(m.type==="spin") setSpin(m.v,(performance.now()-t0)/1000);
  else if(m.type==="insets"){ IN.t=+m.t||0; IN.b=+m.b||0; IN.l=+m.l||0; IN.r=+m.r||0; dispatchEvent(new Event("resize")); }
}); }catch(e){}
document.fonts && document.fonts.ready.then(()=>{ dispatchEvent(new Event("resize")); });
addEventListener("resize",()=>{layout();renderer.setSize(innerWidth,innerHeight,false);composer.setSize(innerWidth,innerHeight);camFit();bgMat.uniforms.uRes.value.set(W,H);grain.uniforms.uRes.value.set(W,H); fxaa.uniforms.resolution.value.set(1/(W*DPR),1/(H*DPR)); buildDial(); fitDust(); [ptMat,flowMat,acuMat].forEach(m=>m.uniforms.uS.value=DPR*Math.max(.7,L.f)); if(FT!==null||fixed) frame(FT!==null?FT:6.0);});
// 调试：?nancheck=1 —— 把主场景渲染到 Float 目标，统计 NaN/Inf 像素（多个旋转角度）
if(q.get("nancheck")){ const rt=new THREE.WebGLRenderTarget(960,540,{type:THREE.FloatType}); const buf=new Float32Array(960*540*4); const out=[];
  for(let a=0;a<360;a+=30){ body.rotation.y=a*Math.PI/180; U.uT.value=6+a*.01; renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene,camera);
    renderer.readRenderTargetPixels(rt,0,0,960,540,buf); let nan=0,inf=0,neg=0,mx=0; for(let i=0;i<buf.length;i++){const v=buf[i]; if(v!==v)nan++; else if(!isFinite(v))inf++; else {if(v<0)neg++; if((i&3)!==3&&v>mx)mx=v;}}
    out.push(`rot${a}: nan=${nan} inf=${inf} neg=${neg} max=${mx.toFixed(2)}`); }
  renderer.setRenderTarget(null); const pre=document.createElement("pre"); pre.id="NAN"; pre.textContent=out.join("\n"); document.body.appendChild(pre); }
if(FT!==null||fixed){ const ts=FT!==null?FT:6.0; let n=0; const kick=()=>{frame(ts); if(++n<6) setTimeout(kick,250); else window.__ready=true;}; kick(); }
else requestAnimationFrame(loop);
</script>
