<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="160" height="160" role="img" aria-label="子午流注·经络全息钟">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#142a5c"/><stop offset=".75" stop-color="#0a1433"/><stop offset="1" stop-color="#050a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c4"/><stop offset="1" stop-color="#ffbf55"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="120" cy="120" r="118" fill="url(#bg)"/>
  <!-- stardust ring -->
  <g filter="url(#glow)">
    <circle cx="120" cy="120" r="96" fill="none" stroke="#7fd8ff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="1 5">
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="90" fill="none" stroke="url(#gold)" stroke-opacity=".9" stroke-width="2.2"/>
    <!-- 12 branch nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="120s" repeatCount="indefinite"/>
      <g fill="#9fe2ff">
        <circle cx="120" cy="30" r="5.5" fill="#fff1c4"/><circle cx="165" cy="42.1" r="3.6"/><circle cx="197.9" cy="75" r="3.6"/>
        <circle cx="210" cy="120" r="3.6"/><circle cx="197.9" cy="165" r="3.6"/><circle cx="165" cy="197.9" r="3.6"/>
        <circle cx="120" cy="210" r="3.6"/><circle cx="75" cy="197.9" r="3.6"/><circle cx="42.1" cy="165" r="3.6"/>
        <circle cx="30" cy="120" r="3.6"/><circle cx="42.1" cy="75" r="3.6"/><circle cx="75" cy="42.1" r="3.6"/>
      </g>
    </g>
    <!-- comet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="12s" repeatCount="indefinite"/>
      <path d="M120 30 A90 90 0 0 0 64.4 49.3" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <circle cx="120" cy="30" r="4" fill="#fff"/>
    </g>
  </g>
  <!-- taiji -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="24s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="56" fill="#10224f" stroke="#a6e6ff" stroke-width="3"/>
    <path d="M120 64 A56 56 0 0 0 120 176 A28 28 0 0 0 120 120 A28 28 0 0 1 120 64 Z" fill="url(#gold)"/>
    <circle cx="120" cy="92" r="8" fill="#ffd27a"/>
    <circle cx="120" cy="148" r="8" fill="#10224f"/>
  </g>
</svg>
